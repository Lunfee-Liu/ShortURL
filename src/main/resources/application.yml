server:
  port: 8080

spring:
  application:
    name: shorturl

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/shorturl?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false"
    username: shorturl
    password: shorturl_pass
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: "true"
    consumer:
      group-id: access-log-recorder
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: "com.example.shorturl.dto"
        fetch.max.wait.ms: 1000
    listener:
      type: batch
      ack-mode: manual_immediate

shorturl:
  base-url: http://localhost:8080
  generator:
    # 62 个不重复字符的乱序排列，决定短码字符映射关系
    alphabet: "n6j7K0qzWNPk3sYBo1HRSXmAgdV9fUcEbiDhlGpQruv2FetywM4TxaLJ5ZOCI8"
    min-code-length: 6
    # 乘法置换密钥，必须与 rangeSize(62^(n-1)*61) 互质，用于打散顺序 ID
    scramble-key: 2654435761

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.shorturl.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
